[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qraft-hpc"
version = "0.2.0"
description = "Declarative, evidence-oriented orchestrator for scientific HPC campaigns"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Jairo Carmona", email = "268262068+Jairomcarmona@users.noreply.github.com" },
]
maintainers = [
    { name = "Jairo Carmona", email = "268262068+Jairomcarmona@users.noreply.github.com" },
]
dependencies = [
    "jsonschema>=4.23,<5",
    "PyYAML>=6.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest>=8", "spglib==2.8.0"]
release = ["build>=1.2"]
dev = ["pytest>=8", "build>=1.2", "spglib==2.8.0"]
symmetry = ["seekpath>=2.1", "spglib==2.8.0"]

[project.urls]
Repository = "https://github.com/Jairomcarmona/siestaflow"
Documentation = "https://github.com/Jairomcarmona/siestaflow/tree/main/docs"
Issues = "https://github.com/Jairomcarmona/siestaflow/issues"

[dependency-groups]
ci = ["setuptools==80.9.0", "wheel==0.45.1"]

[project.scripts]
qraft = "qraft.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qraft.engines.siesta.data" = ["*.json"]
"qraft.execution.controller_schemas" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
