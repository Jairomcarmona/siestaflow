name: Linux regression and installed CLI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qraft-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install declared development dependencies
        run: python -m pip install '.[dev]' 'setuptools>=77'
      - name: Check source and dependencies
        run: |
          git diff --check
          python -m compileall -q src
          python -m pip check
      - name: Test including clean installation and recovery
        run: |
          QRAFT_BUILD_PYTHON="$(command -v python)" python -m pytest -q --junitxml=build/test-results.xml
      - name: Build wheel and sdist
        run: python -m build
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tests-python-${{ matrix.python-version }}
          path: build/test-results.xml
          if-no-files-found: warn
          retention-days: 14
